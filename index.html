<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shoe Tracker</title>
<meta name="description" content="Track distance on your running shoes and know when to retire them.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shoes">
<style>
/* Two looks for the whole app: Soft (default, on :root) and Contrast (body.look-contrast). */
@font-face{font-family:'Archivo Black';src:url(fonts/archivo-black-400.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Space Mono';src:url(fonts/space-mono-700.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
:root{
  --bg:#fff;--surface:#fff;--text:#2B2522;--muted:#5E5550;--faint:#6F6560;--line:#E7E1DC;--track:#F3EFEC;--soft:#F6F3F1;
  --accent:#4E6485;--ok:#7FA88C;--warn:#8F560F;--bad:#B23A36;--warn-bg:#F7EEDD;--bad-bg:#F8E9E7;
  --r:14px;--rs:12px;--pill:99px;--bw:1.5px;
  color-scheme:light;
}
body.look-contrast{
  --bg:#0A0A0A;--surface:#0A0A0A;--text:#fff;--muted:#A3A3A3;--faint:#808080;--line:#3A3A3A;--track:#1C1C1C;--soft:#1C1C1C;
  --accent:#D4F23C;--ok:#D4F23C;--warn:#FF9F1C;--bad:#FF6B98;--warn-bg:#FF9F1C;--bad-bg:#FF6B98;
  --r:0px;--rs:0px;--pill:0px;--bw:1px;
  --disp:'Archivo Black','Arial Black',Impact,sans-serif;--mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;font-family:var(--mono);font-weight:700;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.look-soft :focus-visible{outline:2px solid #2B2522;outline-offset:2px}
.look-contrast :focus-visible{outline:3px solid #D4F23C;outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top)) 0 8px}
.hrow{display:flex;align-items:center;justify-content:space-between;height:44px}
h1{font-size:20px;margin:0;white-space:nowrap}
.hbtns{display:flex;align-items:center;gap:4px}
.icon-btn{width:40px;height:44px;padding:0;border:0;background:none;color:var(--text);display:grid;place-items:center;cursor:pointer}
#shareBtn{display:none}
body.cal #shareBtn{display:grid}
#styleBtn{position:relative;width:44px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
#styleBtn::after,.look-soft .tabs button::after{content:'';position:absolute;inset:-5px 0}
#styleBtn i{width:12px;height:12px}
#styleBtn i:first-child{border-radius:99px;background:#E3A7B2}
.tabs{display:flex;margin-top:14px;padding:4px}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.alerts{margin:12px 0 0;display:grid;gap:6px}
.alert{background:var(--bad-bg);color:var(--bad);padding:10px 14px;border-radius:var(--r);font-size:14px;font-weight:600}
.alert.w{background:var(--warn-bg);color:var(--warn)}
.list{display:grid;gap:10px;margin-top:12px}
.card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:var(--bw) solid var(--line);background:var(--surface);color:var(--text);padding:12px;border-radius:var(--r);font:inherit;cursor:pointer}
.thumb{flex:none;width:56px;height:56px;border-radius:var(--rs);background:var(--c,var(--soft));display:grid;place-items:center;font-weight:700;color:var(--text);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.cut img{object-fit:contain;padding:4px}
.info{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.name{font-weight:650;overflow:hidden;text-overflow:ellipsis}
.star{color:var(--accent)}
.tag{font-size:12px;padding:1px 8px;border-radius:var(--pill);background:var(--soft);color:var(--muted);white-space:nowrap}
.bar{height:8px;background:var(--track);border-radius:var(--pill);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:var(--pill)}
.meta{font-size:13px;color:var(--muted)}
.meta b{color:var(--text)}
.warn{font-size:13px;color:var(--bad);margin-top:4px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty button{margin-top:12px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font-size:22px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted)}
.month{font-size:13px;font-weight:600;color:var(--muted);margin:16px 4px 6px;display:flex;justify-content:space-between}
.runs{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden}
.run{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.run:first-child{border-top:0}
.run .d{width:52px;font-size:13px;color:var(--muted)}
.run .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .k{font-weight:650;white-space:nowrap}
button.run{width:100%;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;min-height:44px}
.dot{flex:none;width:10px;height:10px;border-radius:var(--pill);border:1px solid var(--line)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:6}
.btn{border:0;border-radius:var(--pill);padding:12px 18px;white-space:nowrap;font:inherit;font-weight:650;cursor:pointer;background:var(--soft);color:var(--text)}
.btn.pri{background:var(--text);color:#fff}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.fab .btn{height:48px}
dialog{border:0;padding:0;background:var(--surface);color:var(--text);width:min(560px,100%);max-width:100%;max-height:92vh;border-radius:22px 22px 0 0;margin:auto auto 0}
@media (min-width:600px){dialog{border-radius:22px;margin:auto}}
dialog::backdrop{background:#0008}
dialog form{padding:20px 16px calc(18px + env(safe-area-inset-bottom))}
dialog h2{margin:0 0 14px;font:italic 500 28px/1.1 Georgia,'Times New Roman',serif;letter-spacing:-.5px}
dialog .empty{padding:20px 8px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:var(--bw) solid var(--line);border-radius:var(--rs);background:var(--bg);color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px;color:var(--text);font-weight:500}
.check input{width:auto}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .grow{flex:1}
.actions .btn{padding:12px 13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:var(--bw) solid var(--line);background:var(--bg);color:var(--text);border-radius:var(--pill);padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.photo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.photo .thumb{width:64px;height:64px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.daysum{font-size:14px;color:var(--muted);margin:-8px 0 12px}
.daysum b{color:var(--text)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:var(--rs);background:var(--c);display:grid;place-items:center;cursor:pointer}
.sw i{width:14px;height:14px;border-radius:99px;background:var(--d)}
.sw[aria-checked=true]{outline:2px solid var(--text);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
#cutCv{display:block;max-width:100%;max-height:50vh;margin:10px auto 0;border:1px solid var(--line);cursor:crosshair;touch-action:manipulation}
#shareImg{display:block;max-width:100%;max-height:52vh;margin:0 auto;border:1px solid var(--line)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:20;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------- Soft: header, tabs, floating buttons ---------- */
.look-soft #styleBtn{border:1.5px solid var(--line);border-radius:99px;background:#fff}
.look-soft #styleBtn i:first-child{box-shadow:0 0 0 2px #2B2522}
.look-soft #styleBtn i:last-child{background:#111}
.look-soft .tabs{gap:2px;border-radius:99px;background:var(--soft)}
.look-soft .tabs button{position:relative;height:36px;padding:0 4px;border-radius:99px;font-size:14px}
.look-soft .tabs button.on{background:var(--text);color:#fff}
.look-soft .fab .btn{padding:0 22px;border:1.5px solid var(--line);background:#fff;box-shadow:0 6px 20px rgba(43,37,34,.12)}
.look-soft .fab .btn.pri{border:0;background:var(--text);box-shadow:0 6px 20px rgba(43,37,34,.2)}

/* ---------- Contrast: every component ---------- */
.look-contrast h1{font:400 20px var(--disp);text-transform:uppercase;letter-spacing:.5px}
.look-contrast #styleBtn{border:2px solid #fff;background:#0A0A0A}
.look-contrast #styleBtn i:last-child{background:#D4F23C;outline:2px solid #fff;outline-offset:1px}
.look-contrast .tabs{padding:0;border:2px solid #fff}
.look-contrast .tabs button{height:44px;padding:0;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.5px;color:#fff}
.look-contrast .tabs button.on{background:var(--accent);color:#0A0A0A}
.look-contrast .alert{color:#0A0A0A;font-size:12px;text-transform:uppercase}
.look-contrast .thumb{color:var(--k,var(--muted));font-size:13px}
.look-contrast .name{font:400 15px var(--disp);text-transform:uppercase}
.look-contrast .tag{background:none;border:1px solid var(--faint);font-size:10px;text-transform:uppercase;padding:1px 5px}
.look-contrast .bar{height:10px}
.look-contrast .meta,.look-contrast .warn{font-size:11px}
.look-contrast .empty{font-size:13px;text-transform:uppercase}
.look-contrast .summary{gap:0;border:2px solid #fff}
.look-contrast .stat{border:0;padding:8px 10px}
.look-contrast .stat+.stat{border-left:2px solid #fff}
.look-contrast .stat .v{font:400 26px/1.1 var(--disp)}
.look-contrast .stat .l{font-size:10px;text-transform:uppercase}
.look-contrast .month{font-size:11px;text-transform:uppercase;color:var(--accent)}
.look-contrast .run{font-size:13px}
.look-contrast .run .d{font-size:11px}
.look-contrast .btn{border:2px solid #fff;background:#0A0A0A;color:#fff;font:700 13px var(--mono);text-transform:uppercase;padding:11px 14px}
.look-contrast .btn.pri{border-color:var(--accent);background:var(--accent);color:#0A0A0A}
.look-contrast .btn.danger{border-color:var(--bad);color:var(--bad)}
.look-contrast .actions .btn{padding:11px 10px}
.look-contrast .fab .btn{padding:0 20px;font-size:14px}
.look-contrast dialog{border-top:2px solid #fff;border-radius:0}
@media (min-width:600px){.look-contrast dialog{border:2px solid #fff}}
.look-contrast dialog h2{font:400 22px/1.1 var(--disp);letter-spacing:0;text-transform:uppercase}
.look-contrast label{font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.look-contrast .check{font-size:13px;text-transform:none;letter-spacing:0}
.look-contrast input,.look-contrast select{border-color:var(--faint)}
.look-contrast .chip{border-color:var(--faint);font-size:12px}
.look-contrast .hint{font-size:11px}
.look-contrast .daysum{font-size:12px;text-transform:uppercase}
.look-contrast .toast{background:var(--accent);color:#0A0A0A;font-size:12px;text-transform:uppercase}

/* ---------- calendar: shared layout ---------- */
.calv{display:flex;flex-direction:column;gap:14px;margin-top:6px;line-height:normal}
.cal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;margin-top:4px}
.cal-title{display:flex;align-items:baseline;gap:10px;min-width:0}
.cal-title h2{margin:0;white-space:nowrap}
.cal-title h2 button{border:0;background:none;padding:0;margin:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.cal-nav{display:flex;gap:8px;flex:none}
.cal-nav button{width:44px;height:44px;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--text);background:var(--bg)}
.cal-stats{display:flex;align-items:center}
.cal-block{display:flex;flex-direction:column;gap:6px}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-day{height:58px;min-width:0;margin:0;display:flex;flex-direction:column;justify-content:space-between;position:relative;font:inherit;cursor:pointer}
.cal-day .ph{position:absolute;background:center/contain no-repeat}
.cal-day .ph.sq{background-size:cover}
.cal-legend{display:flex;flex-wrap:wrap}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-weeks h3{margin:0 0 6px}
.cal-rows{display:grid;column-gap:10px;row-gap:2px;grid-auto-rows:22px;align-items:center}
.cal-rows .l{white-space:nowrap}
.cal-rows .t i{display:block;height:100%}
.cal-rows .v{text-align:right;font-size:13px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.cal-grid.anim{animation:calIn .12s ease-out}}
@keyframes calIn{from{opacity:0}}

/* ---------- calendar: Soft ---------- */
.look-soft .cal-title h2{font:italic 500 52px/.95 Georgia,'Times New Roman',serif;letter-spacing:-1.5px}
.look-soft .cal-year{font-size:17px;font-weight:600;color:var(--accent)}
.look-soft .cal-nav button{border:1.5px solid var(--line);border-radius:99px}
.look-soft .cal-stats{gap:8px;flex-wrap:wrap}
.look-soft .cal-stats span{height:36px;padding:0 14px;border-radius:99px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;border:1.5px solid var(--line)}
.look-soft .cal-stats .k{height:34px;border:0;background:var(--text);color:#fff}
.look-soft .cal-wd span{text-align:center;font-size:11px;font-weight:600;color:var(--faint)}
.look-soft .cal-wd span:first-child{color:var(--accent)}
.look-soft .cal-day{border-radius:14px;padding:6px 0 7px;align-items:center;background:#fff;border:1px solid var(--line);color:var(--faint)}
.look-soft .cal-day .n{height:20px;line-height:20px;font-size:11px;font-weight:600}
.look-soft .cal-day .km{font-size:14px;font-weight:700;letter-spacing:-.2px}
.look-soft .cal-day .more{position:absolute;top:5px;right:5px;font-size:9px;font-weight:700}
.look-soft .cal-day.fut{background:#FAF8F6;border:0}
.look-soft .cal-day.run{background:var(--c);border:0;color:var(--text)}
.look-soft .cal-day.today .n{width:20px;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;text-align:center}
.look-soft .cal-day.pic .n{position:absolute;top:3px;left:5px;height:16px;line-height:16px;font-size:10px}
.look-soft .cal-day.pic.today .n{left:3px;width:16px}
.look-soft .cal-day .ph{inset:16px 3px 4px}
.look-soft .cal-day .ph.sq{inset:18px 6px 5px;border-radius:8px}
.look-soft .cal-legend{gap:6px 14px}
.look-soft .cal-legend span{font-size:12px;color:var(--muted)}
.look-soft .cal-legend i{width:10px;height:10px;border-radius:99px;background:var(--k)}
.look-soft .cal-legend b{color:var(--text)}
.look-soft .cal-weeks h3{font-size:13px;font-weight:700}
.look-soft .cal-rows{grid-template-columns:minmax(74px,auto) 1fr minmax(36px,auto)}
.look-soft .cal-rows .l{font-size:12px;color:var(--muted)}
.look-soft .cal-rows .t{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.look-soft .cal-rows .t i{border-radius:99px;background:#9FB6CF}

/* ---------- calendar: Contrast ---------- */
.look-contrast .cal-title{align-items:flex-end}
.look-contrast .cal-title h2{font:400 84px/.8 var(--disp);letter-spacing:-3px;text-transform:uppercase}
.look-contrast .cal-year{font-size:15px;color:var(--accent);padding-bottom:2px}
.look-contrast .cal-nav button{border:2px solid #fff}
.look-contrast .cal-stats{border:2px solid #fff;align-items:stretch}
.look-contrast .cal-stats div{flex:1;min-width:0;padding:8px 10px;display:flex;flex-direction:column;gap:2px;border-left:2px solid #fff}
.look-contrast .cal-stats div:first-child{border-left:0;background:var(--accent);color:#0A0A0A}
.look-contrast .cal-stats small{font-size:10px;color:var(--muted)}
.look-contrast .cal-stats div:first-child small{color:inherit}
.look-contrast .cal-stats b{font:400 26px/1 var(--disp)}
.look-contrast .cal-wd span{font-size:10px;text-transform:uppercase;color:var(--muted)}
.look-contrast .cal-wd span:first-child{color:var(--accent)}
.look-contrast .cal-day{padding:4px 5px 5px;align-items:stretch;text-align:left;font-family:var(--mono);font-weight:700;background:#0A0A0A;border:1px solid #3A3A3A;color:#A3A3A3}
.look-contrast .cal-day .top{display:flex;justify-content:space-between;align-items:baseline}
.look-contrast .cal-day .n{font-size:10px}
.look-contrast .cal-day .code,.look-contrast .cal-day .more{font-size:9px}
.look-contrast .cal-day .km{font:400 14px/1 var(--disp);letter-spacing:-.4px}
.look-contrast .cal-day.fut{border:1px dashed #2A2A2A;color:#808080}
.look-contrast .cal-day.run{background:var(--c);color:var(--k);border:0}
.look-contrast .cal-day.pic{background:#0A0A0A;color:#fff;border:2px solid var(--c);padding:2px 3px 3px}
.look-contrast .cal-day.today{outline:2px solid #fff;outline-offset:2px}
.look-contrast .cal-day .ph{inset:15px 2px 2px}
.look-contrast .cal-day .ph.sq{inset:16px 4px 3px}
.look-contrast .cal-legend{gap:6px 12px}
.look-contrast .cal-legend span{font-size:11px;color:var(--muted);text-transform:uppercase}
.look-contrast .cal-legend i{min-width:22px;height:16px;padding:0 3px;background:var(--c);color:var(--k);font-size:9px;font-style:normal;display:inline-grid;place-items:center}
.look-contrast .cal-legend b{color:#fff}
.look-contrast .cal-weeks h3{font:400 14px var(--disp);text-transform:uppercase;letter-spacing:.5px}
.look-contrast .cal-rows{grid-template-columns:minmax(78px,auto) 1fr minmax(40px,auto)}
.look-contrast .cal-rows .l{font-size:11px;color:var(--muted);text-transform:uppercase}
.look-contrast .cal-rows .t{height:14px;background:var(--track)}
.look-contrast .cal-rows .t i{background:var(--accent)}
</style>
<style id="pics"></style>
</head>
<body class="look-soft">
<div class="wrap">
  <header>
    <div class="hrow"><h1>Shoe Tracker</h1><div class="hbtns">
      <button type="button" class="icon-btn" id="shareBtn" aria-label="Share this month"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg></button>
      <button type="button" id="styleBtn"><i></i><i></i></button>
      <button type="button" class="icon-btn" id="menuBtn" aria-label="Settings"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
    </div></div>
    <nav class="tabs">
      <button data-tab="shoes" class="on">Shoes</button>
      <button data-tab="calendar">Calendar</button>
      <button data-tab="runs">Runs</button>
      <button data-tab="retired">Retired</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<div class="fab">
  <button class="btn" id="addShoeBtn">+ Shoe</button>
  <button class="btn pri" id="addRunBtn">+ Run</button>
</div>

<div class="toast" id="toast"></div>

<!-- Shoe dialog -->
<dialog id="shoeDlg">
  <form id="shoeForm" method="dialog">
    <h2 id="shoeTitle">Add shoe</h2>
    <label for="sName">Name / model</label>
    <input id="sName" required maxlength="60" placeholder="e.g. Pegasus 41 (blue)">
    <div class="two">

<script>
const KEY = 'shoetracker.v1';
const TYPES = ['Daily', 'Tempo', 'Race', 'Long run', 'Trail', 'Recovery', 'Walk / other'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtDate = s => new Date(s + 'T00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

/* pure:start — calendar maths and units. Data in, data out: no DOM, no reads of S. tests.html loads this block. */
const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };  // local, never new Date(str)
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (ym, n) => { const d = pd(ym); d.setMonth(d.getMonth() + n); return iso(d).slice(0, 7); };
const weekOf = (s, weekStart) => addDays(s, -((pd(s).getDay() - weekStart + 7) % 7));
function monthGrid(ym, weekStart) {
  const [y, m] = ym.split('-').map(Number), n = new Date(y, m, 0).getDate();
  const cells = Array((new Date(y, m - 1, 1).getDay() - weekStart + 7) % 7).fill(null);
  for (let d = 1; d <= n; d++) cells.push(`${ym}-${pad2(d)}`);
  while (cells.length % 7) cells.push(null);
  return Array.from({ length: cells.length / 7 }, (_, i) => cells.slice(i * 7, i * 7 + 7));
}
function dayIndex(runs) {
  const idx = new Map();
  for (const r of runs) { if (!idx.has(r.date)) idx.set(r.date, { km: 0, runs: [], mainShoeId: null }); const d = idx.get(r.date); d.km += r.km; d.runs.push(r); }
  for (const d of idx.values()) {
    d.runs.sort((a, b) => (a.t || 0) - (b.t || 0));
    const by = new Map();
    for (const r of d.runs) { const e = by.get(r.shoeId) || { km: 0, t: 0 }; e.km += r.km; e.t = Math.max(e.t, r.t || 0); by.set(r.shoeId, e); }
    d.mainShoeId = [...by].sort((a, b) => b[1].km - a[1].km || b[1].t - a[1].t)[0][0];
  }
  return idx;
}
function monthSummary(runs, ym) {
  const out = { km: 0, count: 0, longest: 0, byShoe: [] }, by = new Map();
  for (const r of runs) if (r.date.slice(0, 7) === ym) {
    out.km += r.km; out.count++; out.longest = Math.max(out.longest, r.km);
    if (!by.has(r.shoeId)) by.set(r.shoeId, { shoeId: r.shoeId, km: 0, count: 0 });
    const e = by.get(r.shoeId); e.km += r.km; e.count++;
  }
  out.byShoe = [...by.values()].sort((a, b) => b.km - a.km);
  return out;
}
function weekTotals(runs, ym, weekStart) {
  return monthGrid(ym, weekStart).map(w => {
    const i = w.findIndex(Boolean), from = addDays(w[i], -i), to = addDays(from, 6);
    return { from, to, km: runs.reduce((a, r) => r.date >= from && r.date <= to ? a + r.km : a, 0) };
  });
}
function weekStreak(runs, todayStr, weekStart) {
  const weeks = new Set(runs.map(r => weekOf(r.date, weekStart)));
  let cur = weekOf(todayStr, weekStart), n = 0;
  if (!weeks.has(cur)) cur = addDays(cur, -7);
  while (weeks.has(cur)) { n++; cur = addDays(cur, -7); }
  return n;
}
const validColor = v => Number.isInteger(v) && v >= 0 && v < 6;
function freeColor(shoes, pos, self) {
  const used = new Set(shoes.filter(s => s !== self && !s.retired && validColor(s.colorIdx)).map(s => s.colorIdx));
  for (let i = 0; i < 6; i++) if (!used.has(i)) return i;
  return pos % 6;
}
function assignColors(shoes) { shoes.forEach((s, i) => { if (!validColor(s.colorIdx)) s.colorIdx = freeColor(shoes, i, s); }); return shoes; }
// Everything is stored in km; miles only exist on screen.
const KM_PER_MI = 1.609344;
const kmTo = (km, unit) => unit === 'mi' ? km / KM_PER_MI : km;
const kmFrom = (v, unit) => unit === 'mi' ? v * KM_PER_MI : v;
/* pure:end */

// ---------- state ----------
function load() {
  const base = { shoes: [], runs: [], defaultShoeId: null, ageMonths: 12, currency: '', lastBackup: null, calTheme: 'soft', weekStart: 0, unit: 'km', limitKm: 700, calCell: 'block' };
  let d = base;
  try { const p = JSON.parse(localStorage.getItem(KEY)); if (p && Array.isArray(p.shoes)) d = { ...base, ...p }; } catch (e) {}
  // additive migration: fresh state, old state and restored backups all pass through here
  if (d.calTheme !== 'contrast') d.calTheme = 'soft';   // the look of the whole app (named calTheme since the calendar came first)
  d.weekStart = d.weekStart === 1 ? 1 : 0;
  d.unit = d.unit === 'mi' ? 'mi' : 'km';
  d.limitKm = d.limitKm > 0 ? +d.limitKm : 700;
  d.calCell = d.calCell === 'photo' ? 'photo' : 'block';
  assignColors(d.shoes);
  return d;
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { alert('Could not save — storage is full. Remove some shoe photos or export a backup.'); }
}
let tab = 'shoes';
let calMonth = today().slice(0, 7), calSel = null, calAnim = false;

// ---------- distance on screen ----------
const U = () => S.unit;
const fmtD = km => (Math.round(kmTo(km, S.unit) * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
const d1 = km => (Math.round(kmTo(km, S.unit) * 10) / 10).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
// Distance inputs: show in the chosen unit, but hand back the exact stored km when the field was not edited (no rounding drift).
function setD(el, km, dp = 2, unit = S.unit) {
  el._km = km; el._unit = unit;
  el.value = el._pre = km === '' || km == null ? '' : String(+kmTo(km, unit).toFixed(unit === 'mi' ? dp : 2));
}
const getD = el => el.value === el._pre && el._km !== '' && el._km != null ? el._km : kmFrom(num(el.value), el._unit || S.unit);

// ---------- stats ----------
function stats(sh) {
  let run = 0, n = 0;
  for (const r of S.runs) if (r.shoeId === sh.id) { run += r.km; n++; }
  const km = (sh.startKm || 0) + run;
  const pct = sh.limitKm > 0 ? km / sh.limitKm : 0;
  const end = sh.retired || today();
  const ms = new Date(end) - new Date(sh.start);
  const days = Math.max(0, Math.round(ms / 864e5));
  return { km, pct, n, days, months: days / 30.44, cpk: sh.price > 0 && km > 0 ? sh.price / kmTo(km, S.unit) : null };
}
const color = p => p >= .9 ? 'var(--bad)' : p >= .7 ? 'var(--warn)' : 'var(--ok)';
const ageStr = m => m < 1 ? Math.round(m * 30.44) + ' d' : m < 12 ? Math.floor(m) + ' mo' : (m / 12).toFixed(1) + ' yr';
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const money = v => esc(S.currency) + v.toLocaleString(undefined, { maximumFractionDigits: v < 10 ? 2 : 0 });
const active = () => S.shoes.filter(s => !s.retired);
const shoeById = id => S.shoes.find(s => s.id === id);

// ---------- shoe colors ----------
// Palette by colorIdx. soft: [fill, dot]; contrast: [fill, text on it].
const CAL_PAL = {
  soft: [['#DCE6F0', '#9FB6CF'], ['#E9E2F2', '#BCA9D6'], ['#F6E0E4', '#E3A7B2'], ['#E1E8DC', '#A9BC9D'], ['#F4E6D8', '#D9B38C'], ['#EDEBE8', '#9C9A98']],
  contrast: [['#D4F23C', '#0A0A0A'], ['#FFFFFF', '#0A0A0A'], ['#FF6B98', '#0A0A0A'], ['#2D46F5', '#FFFFFF'], ['#FF9F1C', '#0A0A0A'], ['#3DDCFF', '#0A0A0A']],
};
const CAL_NAMES = { soft: ['Blue', 'Lilac', 'Rose', 'Sage', 'Sand', 'Grey'], contrast: ['Volt', 'White', 'Pink', 'Blue', 'Orange', 'Cyan'] };
const calPal = idx => CAL_PAL[S.calTheme][validColor(idx) ? idx : 0];
const calVars = idx => { const [c, k] = calPal(idx); return `--c:${c};--k:${k}`; };
const calDot = idx => calPal(idx)[S.calTheme === 'soft' ? 1 : 0];
const calShoe = id => { const sh = shoeById(id); return sh ? { name: sh.name, type: sh.type || '', idx: sh.colorIdx, code: initials(sh.name), photo: sh.photo, cut: !!sh.photoCut } : { name: '(deleted shoe)', type: '', idx: 0, code: '?', photo: null, cut: false }; };
const loc = (d, o) => d.toLocaleDateString(undefined, o);

// ---------- views ----------
function thumb(sh) { return `<div class="thumb${sh.photo && sh.photoCut ? ' cut' : ''}" style="${calVars(sh.colorIdx)}">${sh.photo ? `<img src="${esc(sh.photo)}" alt="">` : esc(initials(sh.name))}</div>`; }

function card(sh) {
  const s = stats(sh), warns = [];
  if (!sh.retired) {
    if (s.pct >= 1) warns.push('Past its limit — time to replace');
    else if (s.pct >= .9) warns.push(`${fmtD(sh.limitKm - s.km)} ${U()} left — shop for a replacement`);
  }
  const when = sh.retired ? `${fmtDate(sh.start)} → ${fmtDate(sh.retired)} (${ageStr(s.months)})` : ageStr(s.months) + ' old';
  return `<button class="card" data-shoe="${sh.id}">${thumb(sh)}
    <div class="info">
      <div class="top"><span class="name">${esc(sh.name)}</span>${!sh.retired && S.defaultShoeId === sh.id ? '<span class="star" title="Default shoe">★</span>' : ''}${sh.type ? `<span class="tag">${esc(sh.type)}</span>` : ''}</div>
      <div class="bar"><i style="width:${Math.min(s.pct, 1) * 100}%;background:${color(s.pct)}"></i></div>
      <div class="meta"><b>${fmtD(s.km)}</b> / ${fmtD(sh.limitKm)} ${U()} · ${Math.round(s.pct * 100)}% · ${s.n} run${s.n === 1 ? '' : 's'}</div>
      <div class="meta">${when}${s.cpk != null ? ` · ${money(s.cpk)}/${U()}` : ''}</div>
      ${warns.map(w => `<div class="warn">${esc(w)}</div>`).join('')}
    </div></button>`;
}

function viewShoes() {
  const list = active();
  if (!list.length) return `<div class="empty">No shoes yet.<br><button class="btn pri" data-act="addShoe">Add your first pair</button></div>`;
  const sorted = [...list].sort((a, b) => stats(b).pct - stats(a).pct);
  const alerts = [];
  for (const sh of sorted) {
    const s = stats(sh);
    if (s.pct >= 1) alerts.push(`<div class="alert">${esc(sh.name)} is past ${fmtD(sh.limitKm)} ${U()}. Retire it.</div>`);
    else if (s.pct >= .9) alerts.push(`<div class="alert w">${esc(sh.name)} is at ${Math.round(s.pct * 100)}%. Replace soon.</div>`);
  }
  return (alerts.length ? `<div class="alerts">${alerts.join('')}</div>` : '') + `<div class="list">${sorted.map(card).join('')}</div>`;
}

function viewRetired() {
  const list = S.shoes.filter(s => s.retired).sort((a, b) => b.retired.localeCompare(a.retired));
  if (!list.length) return `<div class="empty">No retired shoes yet.<br>Tap a shoe and choose “Retire” when it's done.</div>`;
  const total = list.reduce((a, sh) => a + stats(sh).km, 0);
  return `<div class="summary"><div class="stat"><div class="v">${list.length}</div><div class="l">pairs retired</div></div>
    <div class="stat"><div class="v">${fmtD(total / list.length)}</div><div class="l">avg ${U()} per pair</div></div></div>
    <div class="list">${list.map(card).join('')}</div>`;
}

function viewRuns() {
  const runs = [...S.runs].sort((a, b) => b.date.localeCompare(a.date) || (b.t || 0) - (a.t || 0));
  if (!runs.length) return `<div class="empty">No runs logged yet.<br>Tap “+ Run” after each run.</div>`;
  const ym = today().slice(0, 7), y = today().slice(0, 4);
  const sum = f => runs.filter(f).reduce((a, r) => a + r.km, 0);
  let html = `<div class="summary"><div class="stat"><div class="v">${fmtD(sum(r => r.date.startsWith(ym)))}</div><div class="l">${U()} this month</div></div>
    <div class="stat"><div class="v">${fmtD(sum(r => r.date.startsWith(y)))}</div><div class="l">${U()} this year</div></div></div>`;
  const groups = new Map();
  for (const r of runs) { const k = r.date.slice(0, 7); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  for (const [k, rs] of groups) {
    const label = new Date(k + '-01T00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    html += `<div class="month"><span>${label}</span><span>${fmtD(rs.reduce((a, r) => a + r.km, 0))} ${U()}</span></div><div class="runs">`;
    for (const r of rs) {
      const sh = calShoe(r.shoeId);
      const d = new Date(r.date + 'T00:00').toLocaleDateString(undefined, { day: 'numeric', weekday: 'short' });
      html += `<div class="run" data-run="${r.id}"><span class="d">${d}</span><i class="dot" style="background:${calDot(sh.idx)}"></i><span class="s">${esc(sh.name)}</span><span class="k">${fmtD(r.km)} ${U()}</span></div>`;
    }
    html += '</div>';
  }
  return html;
}

// ---------- calendar ----------
const CHEV = d => `<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"></path></svg>`;
// "Nov 1–7", "8–14", "29–Dec 5": the month is named on the first row and wherever it changes.
function weekLabels(weeks) {
  const md = d => loc(d, { month: 'short', day: 'numeric' }), dd = d => loc(d, { day: 'numeric' });
  return weeks.map((w, i) => {
    const f = pd(w.from), t = pd(w.to), newMonth = i === 0 || f.getMonth() !== pd(weeks[i - 1].to).getMonth();
    return (newMonth ? md(f) : dd(f)) + '–' + (t.getMonth() !== f.getMonth() ? md(t) : dd(t));
  });
}
const cellD = km => kmTo(km, S.unit) >= 100 ? String(Math.round(kmTo(km, S.unit))) : d1(km);

function viewCalendar() {
  if (!S.shoes.length) return viewShoes();
  const soft = S.calTheme === 'soft', ws = S.weekStart, td = today(), first = pd(calMonth);
  const days = dayIndex(S.runs), sum = monthSummary(S.runs, calMonth), weeks = weekTotals(S.runs, calMonth, ws), streak = weekStreak(S.runs, td, ws);
  const focusDay = calSel && calSel.startsWith(calMonth) ? calSel : td.startsWith(calMonth) ? td : calMonth + '-01';
  const head = `<div class="cal-head"><div class="cal-title"><h2><button type="button" data-cal="today" aria-label="${esc(loc(first, { month: 'long', year: 'numeric' }))}. Go to current month">${esc(loc(first, { month: soft ? 'long' : 'short' }))}</button></h2><span class="cal-year">${first.getFullYear()}</span></div>
    <div class="cal-nav"><button type="button" data-cal="prev" aria-label="Previous month">${CHEV('M15 5l-7 7 7 7')}</button><button type="button" data-cal="next" aria-label="Next month">${CHEV('M9 5l7 7-7 7')}</button></div></div>`;
  const runsLbl = sum.count === 1 ? 'run' : 'runs';
  const stats = soft
    ? `<div class="cal-stats"><span class="k">${d1(sum.km)} ${U()}</span><span>${sum.count} ${runsLbl}</span>${streak >= 2 ? `<span>${streak}-week streak</span>` : ''}</div>`
    : `<div class="cal-stats"><div><small>${U().toUpperCase()}</small><b>${d1(sum.km)}</b></div><div><small>${runsLbl.toUpperCase()}</small><b>${sum.count}</b></div>${streak >= 2 ? `<div><small>STREAK WK</small><b>${streak}</b></div>` : ''}</div>`;
  const wd = `<div class="cal-wd" aria-hidden="true">${[0, 1, 2, 3, 4, 5, 6].map(i => `<span>${esc(loc(new Date(2023, 0, 1 + ws + i), { weekday: 'short' }))}</span>`).join('')}</div>`;
  const cell = date => {
    if (!date) return '<span></span>';
    const d = days.get(date), n = +date.slice(8), isToday = date === td, cls = ['cal-day'];
    let label = loc(pd(date), { weekday: 'long', month: 'long', day: 'numeric' }), style = '', body = '<span></span>', code = '', more = '';
    if (d) {

      if ((x > 0 && back[i - 1]) || (x < w - 1 && back[i + 1]) || (y > 0 && back[i - w]) || (y < h - 1 && back[i + w])) {
        const a = Math.min(1, Math.max(.35, (dist(i) - tol * .5) / tol));
        if (a < 1) for (let ch = 0; ch < 3; ch++) px[o + ch] = Math.max(0, Math.min(255, Math.round((px[o + ch] - (1 - a) * bg[ch]) / a)));
        px[o + 3] = Math.round(px[o + 3] * a);
      }
      grow(i);
    }
    ctx.putImageData(image, 0, 0);
  }
  if (kept < total * .03 || kept > total * .97) return null;   // nothing left, or nothing removed
  // 4. Crop to the shoe with a little breathing room.
  const pad = Math.round(Math.max(maxX - minX, maxY - minY) * .05), cx = Math.max(0, minX - pad), cy = Math.max(0, minY - pad);
  const out = document.createElement('canvas'); out.width = Math.min(w, maxX + pad + 1) - cx; out.height = Math.min(h, maxY + pad + 1) - cy;
  out.getContext('2d').drawImage(canvas, cx, cy, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}
// A cut-out PNG of the shoe (at most 240px), or null when the background can't be removed.
function cutThumb(img) {
  const s = Math.min(1, 600 / Math.max(img.width, img.height)), work = document.createElement('canvas');
  work.width = Math.max(1, Math.round(img.width * s)); work.height = Math.max(1, Math.round(img.height * s));
  work.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0, work.width, work.height);
  const cut = cutout(work); return cut && thumbPng(cut);
}
function thumbPng(c) {
  const t = Math.min(1, 240 / Math.max(c.width, c.height)), out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(c.width * t)); out.height = Math.max(1, Math.round(c.height * t));
  out.getContext('2d').drawImage(c, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}
// A copy of a picture on a canvas, at most `max` px on its long side.
function toCanvas(img, max) {
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
  c.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0, c.width, c.height);
  return c;
}

// ---------- shoe photo: cut-out from any background (tap the shoe) ----------
// For photos the plain-background cutout() can't handle. Uses MediaPipe's Interactive Segmenter, on the device.
// The library and model (vendor/mediapipe, about 16 MB) are fetched from this site the first time only; the photo is never uploaded.
let segmenterP = null, segmenterReady = false;
function segmenter() {
  return segmenterP || (segmenterP = (async () => {
    const v = await import('./vendor/mediapipe/vision_bundle.mjs');
    const files = await v.FilesetResolver.forVisionTasks('vendor/mediapipe/wasm');
    const seg = await v.InteractiveSegmenter.createFromOptions(files, { baseOptions: { modelAssetPath: 'vendor/mediapipe/magic_touch.tflite' }, outputCategoryMask: false, outputConfidenceMasks: true });
    segmenterReady = true; return seg;
  })().catch(e => { segmenterP = null; throw e; }));
}
// The picture with everything but the tapped object made transparent. pts: taps as fractions of width and height.
async function segmentAt(src, pts) {
  const seg = await segmenter();
  const mask = await new Promise((res, rej) => {
    try {
      seg.segment(src, pts.length > 1 ? { scribble: pts } : { keypoint: pts[0] }, r => {
        // one confidence mask per layer; the object is the layer that is strongest where the user tapped
        let best = null;
        for (const m of r.confidenceMasks || []) {
          const d = m.getAsFloat32Array(), w = m.width, h = m.height;
          const at = d[Math.min(h - 1, Math.floor(pts[0].y * h)) * w + Math.min(w - 1, Math.floor(pts[0].x * w))];
          if (!best || at > best.at) best = { at, w, h, d: d.slice() };
        }
        best ? res(best) : rej(new Error('no mask'));
      });
    } catch (e) { rej(e); }
  });
  const mc = document.createElement('canvas'); mc.width = mask.w; mc.height = mask.h;
  const mx = mc.getContext('2d'), id = mx.createImageData(mask.w, mask.h);
  for (let i = 0; i < mask.d.length; i++) id.data[i * 4 + 3] = Math.max(0, Math.min(1, (mask.d[i] - .3) / .4)) * 255;   // soft edge
  mx.putImageData(id, 0, 0);
  const out = document.createElement('canvas'); out.width = src.width; out.height = src.height;
  const o = out.getContext('2d', { willReadFrequently: true });
  o.drawImage(src, 0, 0); o.globalCompositeOperation = 'destination-in'; o.imageSmoothingQuality = 'high'; o.drawImage(mc, 0, 0, out.width, out.height);
  return out;
}
let cutSrc = null, cutPts = [], cutOut = null, cutBusy = false;
function drawCut() {
  const cv = $('#cutCv'), c = cv.getContext('2d'), r = Math.max(5, cutSrc.width / 60);
  cv.width = cutSrc.width; cv.height = cutSrc.height;
  if (cutOut) { c.fillStyle = S.calTheme === 'soft' ? '#F6F3F1' : '#1C1C1C'; c.fillRect(0, 0, cv.width, cv.height); c.globalAlpha = .22; c.drawImage(cutSrc, 0, 0); c.globalAlpha = 1; c.drawImage(cutOut, 0, 0); }
  else c.drawImage(cutSrc, 0, 0);
  for (const p of cutPts) { c.beginPath(); c.arc(p.x * cv.width, p.y * cv.height, r, 0, 7); c.fillStyle = '#D4F23C'; c.fill(); c.lineWidth = r / 3; c.strokeStyle = '#0A0A0A'; c.stroke(); }
  $('#cutUse').disabled = !cutOut || cutBusy; $('#cutReset').disabled = !cutPts.length || cutBusy;
}
async function openCut() {
  try { cutSrc = ph.src || toCanvas(await loadImg(ph.orig), 1024); } catch (e) { return toast('Could not read that image'); }
  cutPts = []; cutOut = null; cutBusy = false; drawCut();
  $('#cutNote').textContent = 'Tap the shoe.';
  $('#cutDlg').showModal();
}
$('#cutCv').onclick = async e => {
  if (cutBusy) return;
  const b = e.currentTarget.getBoundingClientRect();
  cutPts.push({ x: Math.min(.999, Math.max(0, (e.clientX - b.left) / b.width)), y: Math.min(.999, Math.max(0, (e.clientY - b.top) / b.height)) });
  cutBusy = true; drawCut();
  $('#cutNote').textContent = segmenterReady ? 'Cutting out…' : 'Getting the cut-out tool ready (16 MB, first time only)…';
  try { cutOut = await segmentAt(cutSrc, cutPts); $('#cutNote').textContent = 'Looks right? Tap “Use it”. If a part is missing, tap that part too.'; }
  catch (err) { cutPts.pop(); $('#cutNote').textContent = navigator.onLine === false ? 'The cut-out tool needs to download once. Connect to the internet and tap the shoe again.' : 'The cut-out tool could not start on this device. You can keep the original photo.'; }
  cutBusy = false; drawCut();
};
$('#cutReset').onclick = () => { cutPts = []; cutOut = null; drawCut(); $('#cutNote').textContent = 'Tap the shoe.'; };
$('#cutUse').onclick = () => {
  const c = cutOut && cutout(toCanvas(cutOut, 1024));
  if (!c) { $('#cutNote').textContent = "That didn't pick out the shoe. Tap “Start over” and tap the middle of the shoe."; return; }
  ph.cut = thumbPng(c); ph.useCut = true; ph.tried = true;
  $('#cutDlg').close(); setPhotoPrev();
};

// ---------- shoe dialog ----------
// ph: the photo being edited. orig = square JPEG, cut = transparent PNG, useCut = which one is saved,
// tried = the quick plain-background cut-out was attempted, src = the full picture (canvas) while it is still at hand.
const noPhoto = () => ({ orig: null, cut: null, useCut: false, tried: false, src: null });
let editShoe = null, ph = noPhoto(), pendingColor = 0;
$('#sType').innerHTML = TYPES.map(t => `<option>${t}</option>`).join('');
function setPhotoPrev() {
  const src = ph.useCut ? ph.cut : ph.orig, box = $('#sPhotoPrev'), b = $('#sPhotoCut');
  box.className = 'thumb' + (src && ph.useCut ? ' cut' : '');
  box.innerHTML = src ? `<img src="${esc(src)}" alt="">` : '👟';
  $('#sPhotoDel').hidden = !src;
  b.hidden = !src || (ph.useCut && !ph.orig);
  b.textContent = ph.useCut ? 'Original' : 'Cut out';
  $('#sPhotoNote').textContent = !src ? 'Choose a photo, then tap the shoe to cut it out of the background. A cut-out can be shown on the calendar.'
    : ph.useCut ? (ph.orig ? 'Background removed.' : 'Background removed. To redo it, choose the photo again.') : 'Tap “Cut out” to remove the background.';
}
function setColors() {
  $('#sColors').innerHTML = CAL_PAL[S.calTheme].map(([c], i) => `<button type="button" class="sw" role="radio" aria-checked="${i === pendingColor}" aria-label="${CAL_NAMES[S.calTheme][i]}" data-color="${i}" style="--c:${c};--d:${calDot(i)}"><i></i></button>`).join('');
}
$('#sColors').onclick = e => { const b = e.target.closest('[data-color]'); if (b) { pendingColor = +b.dataset.color; setColors(); $(`#sColors [data-color="${pendingColor}"]`).focus(); } };
function openShoe(id) {
  editShoe = id ? shoeById(id) : null;
  const sh = editShoe || { name: '', type: 'Daily', start: today(), startKm: 0, limitKm: S.limitKm, price: '' };
  $('#shoeTitle').textContent = editShoe ? 'Edit shoe' : 'Add shoe';
  $('#sName').value = sh.name; $('#sType').value = sh.type || 'Daily'; $('#sStart').value = sh.start;
  setD($('#sStartKm'), sh.startKm || 0, 1); setD($('#sLimit'), sh.limitKm, 0); $('#sPrice').value = sh.price || '';
  $('#curLbl').textContent = S.currency ? `(${S.currency})` : '';
  $('#sDefault').checked = editShoe ? S.defaultShoeId === sh.id : active().length === 0;
  ph = !sh.photo ? noPhoto() : sh.photoCut ? { ...noPhoto(), cut: sh.photo, useCut: true, tried: true } : { ...noPhoto(), orig: sh.photo };
  setPhotoPrev();
  pendingColor = editShoe ? sh.colorIdx : freeColor(S.shoes, S.shoes.length); setColors();
  $('#sDelete').hidden = !editShoe; $('#sRetire').hidden = !editShoe;
  $('#sRetire').textContent = editShoe && editShoe.retired ? 'Un-retire' : 'Retire';
  $('#shoeDlg').showModal();
}
$('#sPhotoPick').onclick = () => $('#sPhoto').click();
$('#sPhotoDel').onclick = () => { ph = noPhoto(); setPhotoPrev(); };
$('#sPhoto').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const url = URL.createObjectURL(f);
  try {
    const img = await loadImg(url);
    ph = { orig: squareThumb(img, 240), cut: null, useCut: false, tried: true, src: toCanvas(img, 1024) };
    try { ph.cut = cutThumb(img); } catch (err) {}   // plain background: instant
    ph.useCut = !!ph.cut; setPhotoPrev();
    if (!ph.cut) openCut();                           // anything else: tap the shoe
  } catch (err) { toast('Could not read that image'); }
  URL.revokeObjectURL(url);
};
$('#sPhotoCut').onclick = async () => {
  if (ph.useCut) { ph.useCut = false; return setPhotoPrev(); }
  if (!ph.tried) {
    ph.tried = true;
    try { ph.cut = cutThumb(ph.src || await loadImg(ph.orig)); } catch (err) {}
    if (ph.cut) { ph.useCut = true; return setPhotoPrev(); }
  }
  openCut();
};
$('#shoeForm').onsubmit = e => {
  e.preventDefault();
  const useCut = !!(ph.useCut && ph.cut);
  const data = {
    name: $('#sName').value.trim(), type: $('#sType').value, start: $('#sStart').value,
    startKm: Math.max(0, getD($('#sStartKm'))), limitKm: Math.max(1, getD($('#sLimit'))),
    price: Math.max(0, num($('#sPrice').value)) || null, photo: useCut ? ph.cut : ph.orig, photoCut: useCut, colorIdx: pendingColor,
  };
  if (!data.name) return;
  let sh = editShoe;
  if (sh) Object.assign(sh, data); else { sh = { id: uid(), retired: null, ...data }; S.shoes.push(sh); }
  if ($('#sDefault').checked) S.defaultShoeId = sh.id; else if (S.defaultShoeId === sh.id) S.defaultShoeId = null;
  save(); $('#shoeDlg').close(); render();
};
$('#sRetire').onclick = () => {
  const sh = editShoe; if (!sh) return;
  if (sh.retired) { sh.retired = null; toast(`${sh.name} is back in rotation`); }
  else {
    if (!confirm(`Retire ${sh.name}? It moves to the Retired tab with its stats.`)) return;
    sh.retired = today(); if (S.defaultShoeId === sh.id) S.defaultShoeId = null;
    toast(`${sh.name} retired after ${fmtD(stats(sh).km)} ${U()}`);
  }
  save(); $('#shoeDlg').close(); render();
};
$('#sDelete').onclick = () => {
  const sh = editShoe; if (!sh) return;
  const n = S.runs.filter(r => r.shoeId === sh.id).length;
  if (!confirm(`Delete ${sh.name}${n ? ` and its ${n} logged run${n === 1 ? '' : 's'}` : ''}? This can't be undone.\n\n(Use “Retire” to keep its history.)`)) return;
  S.shoes = S.shoes.filter(s => s.id !== sh.id); S.runs = S.runs.filter(r => r.shoeId !== sh.id);
  if (S.defaultShoeId === sh.id) S.defaultShoeId = null;
  save(); $('#shoeDlg').close(); render();
};

// ---------- run dialog ----------
let editRun = null;
function openRun(id, date) {
  editRun = id ? S.runs.find(r => r.id === id) : null;
  const shoes = active();
  if (editRun && !shoes.some(s => s.id === editRun.shoeId)) { const sh = shoeById(editRun.shoeId); if (sh) shoes.push(sh); }
  if (!shoes.length) { toast('Add a shoe first'); openShoe(); return; }
  $('#rShoe').innerHTML = shoes.map(s => `<option value="${s.id}">${esc(s.name)}${s.retired ? ' (retired)' : ''}</option>`).join('');
  const lastShoe = [...S.runs].sort((a, b) => (b.t || 0) - (a.t || 0)).find(r => shoes.some(s => s.id === r.shoeId && !s.retired));
  $('#rShoe').value = editRun ? editRun.shoeId : (shoes.some(s => s.id === S.defaultShoeId) ? S.defaultShoeId : lastShoe ? lastShoe.shoeId : shoes[0].id);
  setD($('#rKm'), editRun ? editRun.km : ''); $('#rDate').value = editRun ? editRun.date : date || today();
  $('#runTitle').textContent = editRun ? 'Edit run' : 'Log run';
  $('#rDelete').hidden = !editRun;
  // quick-pick chips from recent distances
  const seen = []; for (const r of [...S.runs].sort((a, b) => (b.t || 0) - (a.t || 0))) { if (!seen.includes(r.km)) seen.push(r.km); if (seen.length >= 6) break; }
  $('#rChips').innerHTML = (seen.length ? seen : [5, 10, 21.1]).map(k => `<button type="button" class="chip" data-km="${k}">${fmtD(k)} ${U()}</button>`).join('');
  $('#runDlg').showModal();
  if (!editRun) setTimeout(() => $('#rKm').focus(), 50);
}
$('#rChips').onclick = e => { const b = e.target.closest('[data-km]'); if (b) setD($('#rKm'), +b.dataset.km); };
$('#runForm').onsubmit = e => {
  e.preventDefault();
  const km = getD($('#rKm')); if (!(km > 0)) return;
  const shoeId = $('#rShoe').value, sh = shoeById(shoeId), before = stats(sh).pct;
  if (editRun) Object.assign(editRun, { shoeId, km, date: $('#rDate').value });
  else S.runs.push({ id: uid(), shoeId, km, date: $('#rDate').value, t: Date.now() });
  save(); $('#runDlg').close(); render();
  const after = stats(sh).pct;
  if (before < 1 && after >= 1) toast(`⚠️ ${sh.name} passed its ${fmtD(sh.limitKm)} ${U()} limit. Time to retire it.`);
  else if (before < .9 && after >= .9) toast(`⚠️ ${sh.name} is at ${Math.round(after * 100)}%. Start shopping for a replacement.`);
  else if (!editRun) toast(`+${fmtD(km)} ${U()} on ${sh.name} (${fmtD(stats(sh).km)} total)`);
};
$('#rDelete').onclick = () => {
  if (!editRun || !confirm('Delete this run?')) return;
  S.runs = S.runs.filter(r => r !== editRun); save(); $('#runDlg').close(); render();
};

// ---------- settings / backup ----------
function openSettings() {
  $('#stUnit').value = S.unit; $('#stLimitU').textContent = S.unit; setD($('#stLimit'), S.limitKm, 0);
  $('#stCal').value = S.calTheme; $('#stWeek').value = S.weekStart; $('#stCell').value = S.calCell; $('#stCur').value = S.currency;
  $('#bkInfo').textContent = `${S.shoes.length} shoes, ${S.runs.length} runs. ` + (S.lastBackup ? `Last backup: ${fmtDate(S.lastBackup)}.` : 'Never backed up — do it once in a while, since clearing browser data erases everything.');
  $('#setDlg').showModal();
}
$('#stUnit').onchange = () => { const u = $('#stUnit').value === 'mi' ? 'mi' : 'km'; setD($('#stLimit'), getD($('#stLimit')), 0, u); $('#stLimitU').textContent = u; };
$('#setForm').onsubmit = e => {
  e.preventDefault();
  const lim = getD($('#stLimit'));
  S.unit = $('#stUnit').value === 'mi' ? 'mi' : 'km';
  if (lim > 0 && Math.abs(lim - S.limitKm) > 1e-6) {
    S.limitKm = lim;
    const others = active().filter(s => Math.abs(s.limitKm - lim) > 1e-6);
    if (others.length && confirm(`New shoes will be replaced at ${fmtD(lim)} ${U()}.\n\nAlso change your ${others.length} current shoe${others.length === 1 ? '' : 's'} to ${fmtD(lim)} ${U()}?`)) others.forEach(s => s.limitKm = lim);
  }
  S.calTheme = $('#stCal').value === 'contrast' ? 'contrast' : 'soft'; S.weekStart = $('#stWeek').value === '1' ? 1 : 0;
  S.calCell = $('#stCell').value === 'photo' ? 'photo' : 'block'; S.currency = $('#stCur').value.trim();
  save(); $('#setDlg').close(); render();
  toast(S.calCell === 'photo' && !S.shoes.some(s => s.photo) ? 'Saved. Add a photo to a shoe to see it on the calendar.' : 'Settings saved');
};
function download(name, data, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#bkJson').onclick = () => {
  S.lastBackup = today(); save();
  download(`shoe-tracker-backup-${today()}.json`, JSON.stringify(S, null, 1), 'application/json'); openSettings();
};
$('#bkCsv').onclick = () => {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['date', 'shoe', 'type', 'km']];
  for (const r of [...S.runs].sort((a, b) => a.date.localeCompare(b.date))) { const sh = shoeById(r.shoeId); rows.push([r.date, sh ? sh.name : '', sh ? sh.type : '', r.km]); }
  download(`shoe-runs-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
};
$('#bkRestore').onclick = () => $('#bkFile').click();
$('#bkFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.shoes) || !Array.isArray(d.runs)) throw 0;
    if (!confirm(`Replace current data with this backup (${d.shoes.length} shoes, ${d.runs.length} runs)?`)) return;
    localStorage.setItem(KEY, JSON.stringify(d)); S = load(); render(); $('#setDlg').close(); toast('Backup restored');
  } catch { toast('That file is not a valid Shoe Tracker backup'); }
};

// ---------- wiring ----------
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); scrollTo(0, 0); });
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
$('#addShoeBtn').onclick = () => openShoe();
$('#addRunBtn').onclick = () => openRun();
$('#menuBtn').onclick = openSettings;
$('#view').onclick = e => {
  const c = e.target.closest('[data-shoe]'); if (c) return openShoe(c.dataset.shoe);
  const r = e.target.closest('[data-run]'); if (r) return openRun(r.dataset.run);
  if (e.target.closest('[data-act="addShoe"]')) return openShoe();
  const d = e.target.closest('[data-day]'); if (d) return openDay(d.dataset.day);
  const m = e.target.closest('[data-cal]');
  if (m) {
    const a = m.dataset.cal, to = a === 'today' ? today().slice(0, 7) : addMonths(calMonth, a === 'prev' ? -1 : 1);
    calAnim = to !== calMonth; calMonth = to; calSel = null; render(); $(`[data-cal="${a}"]`).focus();
  }
};
$('#view').addEventListener('keydown', e => {
  const c = e.target.closest('.cal-day'), step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
  if (!c || !step) return;
  e.preventDefault();
  const n = $(`.cal-day[data-day="${addDays(c.dataset.day, step)}"]`); if (!n) return;
  c.tabIndex = -1; n.tabIndex = 0; n.focus(); calSel = n.dataset.day;
});

render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
